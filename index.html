<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expiry Tracker</title>
    <meta
      name="description"
      content="Track packaged food in your kitchen and get reminded before it expires."
    />
    <!-- Colours the Android address bar in browser mode; the manifest's
         theme_color only applies once the app is installed. -->
    <meta name="theme-color" content="#0f9d8a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the manifest icons entirely and looks for this. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
