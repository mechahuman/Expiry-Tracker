<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearEat</title>
    <meta
      name="description"
      content="See it all. Eat it first. Track packaged food and get reminded before it expires."
    />
    <!-- Colours the Android address bar in browser mode; the manifest's
         theme_color only applies once the app is installed. -->
    <meta name="theme-color" content="#1e5e3c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the manifest icons entirely and looks for this. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
