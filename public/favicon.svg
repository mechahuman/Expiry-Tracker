<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ClearEat">
  <!-- The simplified "C and leaf" mark from the brand board's alternatives.
       The primary mark's fridge contents turn to mush below about 48px, and a
       favicon is rendered at 16 and 32; this keeps the brand's two strongest
       cues, the open ring and the leaf, at strokes heavy enough to survive.
       The detailed mark is used for the app icons, which are 180px and up. -->
  <rect width="64" height="64" rx="14" fill="#1e5e3c"/>

  <!-- Open C, rotated so the gap faces the leaf. -->
  <path d="M45.5 17.5a19 19 0 1 0 4 12"
        fill="none" stroke="#fff7ec" stroke-width="7" stroke-linecap="round"/>

  <!-- Leaf sitting in the gap. -->
  <path d="M42.6 15.4c2.4-5.4 8-8.4 14.6-7.6.8 6.6-2.2 12.4-7.8 14.6-5 2-9.4-1.6-6.8-7Z"
        fill="#4caf6d"/>
</svg>
